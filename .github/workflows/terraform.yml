name: Terraform Preprod

on:
  push:
    branches:
      - feature/landing-zone
  pull_request:
    branches:
      - feature/landing-zone

jobs:
  terraform:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: environment/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
